name: Bug Report
description: 报告插件中的缺陷，帮助我改进。
title: '[BUG] 简短描述问题'
labels: ['bug', 'needs-triage']

body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查列表
      description: 请确认以下事项。
      options:
        - label: 我已搜索现有的 Issue。
          required: true
        - label: 我已使用最新版本的插件。
          required: true
        - label: 我已确认这不是配置问题或上游服务问题（如站点风控、API 额度耗尽）。
          required: true

  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 见 `package.json` 或插件市场页面。
      placeholder: 1.8.6
    validations:
      required: true

  - type: dropdown
    id: koishi_version
    attributes:
      label: Koishi 版本
      options:
        - Koishi v4.x
        - 其他（请在下方补充）
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js 版本
      description: 可执行 `node -v` 查看。本插件依赖 `cheerio`，需要 Node 20.18.1 及以上。
      placeholder: v22.11.0
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 发生问题的适配器 / 平台
      options:
        - onebot
        - qq
        - satori
        - discord
        - telegram
        - kook
        - 其他（请在下方补充）
    validations:
      required: true

  - type: dropdown
    id: service_affected
    attributes:
      label: 受影响的功能
      description: 请选择出问题的搜图引擎或图源，可多选。
      options:
        - SauceNAO
        - IQDB
        - Trace.moe
        - 搜图bot酱 (SoutuBot)
        - Ascii2D
        - Yandex
        - Google Lens
        - Yande.re
        - Konachan
        - Gelbooru
        - Danbooru
        - Pixiv
        - 指令 / 交互逻辑
        - 链接解析
        - 配置页
        - 全部 / 不确定
      multiple: true
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 请描述如何复现，包括使用的指令与相关配置。涉及 API Key 时请先打码。
      placeholder: |
        1. 在平台 X 上完成服务 Y 的配置。
        2. 发送指令 `sauce <图片>`。
        3. 得到错误提示 / 结果不正确。
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 实际错误或 Koishi 日志
      description: 请粘贴相关报错与 Koishi 控制台日志；开启 `debug.enabled` 后的日志更有帮助。
      render: markdown
    validations:
      required: false
